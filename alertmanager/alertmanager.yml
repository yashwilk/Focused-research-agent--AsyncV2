route:
  receiver: default
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Fill in a real webhook (Slack, PagerDuty, email relay, etc.) before
    # relying on this in production — this config defines routing and
    # grouping, which is the part that's easy to get wrong; the
    # destination is a one-line change once you have a real webhook URL.
    webhook_configs:
      - url: "http://localhost:5001/"
        send_resolved: true
