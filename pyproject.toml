[project]
name = "focused-research-agent"
version = "0.2.0"
description = "A LangGraph-based focused research agent — async, authenticated, rate-limited, cached, and observable"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.135.3",
    "httpx>=0.28.0",
    "langgraph==1.0.10",
    "langchain==1.2.10",
    "streamlit==1.52.2",
    "uvicorn[standard]==0.40.0",
    "python-dotenv==1.2.2",
    "tavily-python>=0.7.22",
    "langchain-groq==1.1.2",
    "pydantic[email]>=2.12.5",
    "sqlalchemy[asyncio]>=2.0.49",
    "ollama>=0.6.2",
    # Async DB drivers
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    # Reliability
    "tenacity>=9.0.0",
    # Auth
    "python-jose[cryptography]>=3.4.0",
    "bcrypt>=4.2.0",
    # Rate limiting + caching
    "slowapi>=0.1.9",
    "redis>=5.2.0",
    # Task queue
    "celery[redis]>=5.4.0",
    # Observability
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
]

[project.optional-dependencies]
secrets-aws = ["boto3>=1.35.0"]
secrets-azure = ["azure-identity>=1.19.0", "azure-keyvault-secrets>=4.9.0"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pytest==9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.7",
    "aiosqlite>=0.20.0",
]

[tool.coverage.run]
omit = [
    "src/focused_research_agent/ui/views.py",
    "src/focused_research_agent/ui/Home.py",
    "src/focused_research_agent/ui/pages/1_🔍_Research.py",
    "src/focused_research_agent/ui/pages/2_💬_Chat.py",
    "src/focused_research_agent/ui/pages/3_📄_Report.py",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
focused-research-agent = "focused_research_agent.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
